<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141110">
<meta name="author" content="Leon Tiff">
<meta name="description" content="Conto de Leon Tiff. Acesso protegido por senha.">
<title>Vínculo — Leon Tiff</title>
<style>
    :root{
      color-scheme: dark;
      --bg:#141110; --panel:#1c1717;
      --text:#ece3d4; --muted:#b7a894; --dim:#8f8272;
      --accent:#c28b5a; --accent-hi:#e0ab77;
      --line:rgba(236,227,212,.12);
    }
    *{ box-sizing:border-box }
    html{ -webkit-text-size-adjust:100% }
    body{
      margin:0;
      color:var(--text);
      background-color:var(--bg);
      background-image:radial-gradient(90rem 50rem at 50% -22rem,#261b1a 0%,rgba(20,17,16,0) 62%);
      background-repeat:no-repeat;
      font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua","Times New Roman",serif;
      font-size:16px;
      line-height:1.6;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    }
    ::selection{ background:rgba(194,139,90,.35) }
    img{ max-width:100%; height:auto; -webkit-user-drag:none }
    input, textarea{ -webkit-user-select:text; user-select:text }
    a{ color:inherit }
    a:focus-visible{ outline:2px solid var(--accent-hi); outline-offset:3px; border-radius:3px }
    .wrap{ max-width:62rem; margin:0 auto; padding-left:clamp(1.05rem,4vw,2rem); padding-right:clamp(1.05rem,4vw,2rem) }
    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0 }

    /* topo das páginas de conto */
    .topbar{ display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding-top:1.2rem; padding-bottom:1.05rem; border-bottom:1px solid var(--line) }
    .topbar a{ color:var(--muted); text-decoration:none; font-size:.98rem; transition:color .2s ease }
    .topbar a:hover{ color:var(--accent-hi) }
    .topbar .who{ color:var(--dim); font-size:.78rem; letter-spacing:.3em; text-transform:uppercase; padding-left:.3em }

    /* índice */
    .masthead{ text-align:center; padding-top:clamp(3rem,8vw,5.2rem); padding-bottom:clamp(1.6rem,4vw,2.6rem) }
    .masthead h1{ margin:0; font-weight:500; font-size:clamp(2rem,5.6vw,2.9rem); letter-spacing:.22em; text-transform:uppercase; padding-left:.22em; color:#f2e9da }
    .masthead .tagline{ margin:.95rem 0 0; color:var(--dim); font-size:.72rem; letter-spacing:.6em; text-transform:uppercase; padding-left:.6em }
    .hairline{ width:4.2rem; height:1px; background:var(--line); margin:1.7rem auto 0 }
    .grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(1.3rem,3.5vw,2.1rem); padding-top:clamp(.6rem,2vw,1.2rem); padding-bottom:clamp(1rem,4vw,2.5rem) }
    .card{ flex:1 1 16.5rem; max-width:21.5rem; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:.75rem; overflow:hidden; text-decoration:none; transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease }
    .card:hover{ transform:translateY(-4px); border-color:rgba(194,139,90,.5); box-shadow:0 24px 48px -22px rgba(0,0,0,.85) }
    .card img{ display:block; width:100% }
    .card .body{ display:flex; flex-direction:column; flex:1; gap:.55rem; padding:1.05rem 1.15rem 1.2rem }
    .card h2{ margin:0; font-size:1.3rem; font-weight:600; letter-spacing:.02em }
    .card .teaser{ margin:0; color:var(--muted); font-size:.95rem; line-height:1.62 }
    .card .cta{ margin-top:auto; padding-top:.35rem; color:var(--accent); font-size:.78rem; letter-spacing:.14em; text-transform:uppercase }
    .card:hover .cta{ color:var(--accent-hi) }

    /* página do conto */
    .story{ max-width:43rem; margin:0 auto; padding:clamp(1.9rem,5vw,3.1rem) clamp(1.05rem,4vw,2rem) 0 }
    .cover{ margin:0 auto clamp(2.2rem,5.5vw,3.1rem); width:min(20.5rem,72vw) }
    .cover img{ display:block; width:100%; border-radius:.55rem; border:1px solid var(--line); box-shadow:0 34px 64px -30px rgba(0,0,0,.9) }
    article p{ margin:0 0 1.08em; font-size:clamp(1.04rem,.99rem + .3vw,1.16rem); line-height:1.85; text-align:justify; text-justify:inter-word; hyphens:none }
    article p.scene{ text-align:center; color:var(--dim); letter-spacing:.62em; text-indent:.62em; margin:2em 0 1.85em; font-size:.95em }
    @media (max-width:560px){ article p{ text-align:left } }

    /* porta de senha (conteúdo protegido) */
    .gate{ max-width:26rem; margin:0 auto; padding:2.3rem 1.5rem 2.5rem; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:.75rem }
    .gate .icone{ color:var(--accent) }
    .gate h2{ margin:1rem 0 .4rem; font-size:1.25rem; font-weight:600; letter-spacing:.02em }
    .gate .dica{ margin:0 0 1.35rem; color:var(--muted); font-size:.95rem }
    .gate form{ display:flex; gap:.6rem; justify-content:center; align-items:stretch }
    .gate input{ width:8.5rem; padding:.62rem .8rem; font-size:1.15rem; letter-spacing:.5em; text-indent:.5em; text-align:center; color:var(--text); background:#0f0d0e; border:1px solid var(--line); border-radius:.45rem; font-family:inherit }
    .gate input:focus{ outline:none; border-color:rgba(194,139,90,.6); box-shadow:0 0 0 3px rgba(194,139,90,.15) }
    .gate button{ padding:.62rem 1.15rem; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); background:transparent; border:1px solid rgba(194,139,90,.45); border-radius:.45rem; font-family:inherit; cursor:pointer; transition:color .2s,border-color .2s,background .2s }
    .gate button:hover:enabled{ color:#141110; background:var(--accent) }
    .gate button:disabled{ opacity:.55; cursor:default }
    .gate .erro{ min-height:1.3em; margin:.9rem 0 0; color:#c96b6b; font-size:.9rem }
    .gate.shake{ animation:treme .45s both }
    @keyframes treme{ 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
    #conteudo{ opacity:0; transition:opacity .6s ease }
    #conteudo.exibir{ opacity:1 }
    #conteudo[hidden]{ display:none }

    /* colofão */
    .colophon{ margin-top:clamp(2.8rem,7vw,4.6rem); border-top:1px solid var(--line); color:var(--muted); font-size:.93rem }
    .colophon .wrap{ padding-top:1.7rem; padding-bottom:2.3rem; text-align:center; line-height:2 }
    .colophon .name{ color:var(--dim); font-size:.76rem; letter-spacing:.34em; text-transform:uppercase; padding-left:.34em; margin-bottom:.4rem }
    .colophon a{ text-decoration:none; border-bottom:1px solid transparent; transition:color .2s ease,border-color .2s ease }
    .colophon a:hover{ color:var(--accent-hi); border-bottom-color:var(--accent-hi) }
    .colophon .meta{ margin:.15rem 0 0; display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:.15em .6em }
    .colophon .sep{ color:var(--dim) }
    @media (max-width:560px){ .colophon .meta{ flex-direction:column; gap:.05em; align-items:center } .colophon .sep{ display:none } }
</style>
</head>

  <script>(function(){
  function emCampo(e){var t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');}
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('selectstart',function(e){if(!emCampo(e))e.preventDefault();});
  document.addEventListener('copy',function(e){if(!emCampo(e))e.preventDefault();});
  document.addEventListener('cut',function(e){if(!emCampo(e))e.preventDefault();});
  document.addEventListener('keydown',function(e){
    if(!(e.ctrlKey||e.metaKey))return;
    var k=(e.key||'').toLowerCase();
    if(['c','x','s','u','a','p'].indexOf(k)>=0&&!emCampo(e)){e.preventDefault();}
  });
})();</script>
  <script>(function(){
  var dados=document.getElementById('dados-protegidos');
  var cfg=JSON.parse(dados.textContent);
  var gate=document.getElementById('portao');
  var form=document.getElementById('form-senha');
  var inp=document.getElementById('senha');
  var erro=document.getElementById('erro');
  var art=document.getElementById('conteudo');
  var btn=form.querySelector('button');
  var ocupado=false,tentativas=0;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function treme(){gate.classList.remove('shake');void gate.offsetWidth;gate.classList.add('shake');}
  inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(0,4);});
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(ocupado)return;
    var senha=inp.value;
    if(!/^[0-9]{4}$/.test(senha)){erro.textContent='Digite os 4 d\u00edgitos.';treme();return;}
    ocupado=true;btn.disabled=true;btn.textContent='verificando\u2026';erro.textContent='';
    var enc=new TextEncoder();
    crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(cfg.salt),iterations:cfg.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(cfg.iv)},key,b64(cfg.ct));
    }).then(function(plain){
      art.innerHTML=new TextDecoder().decode(plain);
      art.hidden=false;
      gate.remove();
      dados.remove();
      requestAnimationFrame(function(){art.classList.add('exibir');});
      art.scrollIntoView({block:'start',behavior:'smooth'});
    }).catch(function(){
      tentativas++;
      erro.textContent='Senha incorreta.'+(tentativas>=3?' Verifique a senha com o autor.':'');
      treme();inp.value='';inp.focus();
      var espera=Math.min(tentativas*1200,6000);
      setTimeout(function(){ocupado=false;btn.disabled=false;btn.textContent='acessar';},espera);
    });
  });
  inp.focus();
})();</script>
